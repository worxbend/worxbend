---
name: OWASP ZAP Baseline Scan

# Manual only. The previous `on: [push]` trigger scanned a hard-coded
# third-party URL (https://www.zaproxy.org) from the upstream template on
# every push, which is neither useful nor ours to scan. Point `target` at a
# deployed worxbend environment when one exists, then re-enable a schedule.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL to scan (must be an environment we own)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # owasp/zap2docker-stable was retired in 2023; the image now lives
          # at ghcr.io/zaproxy/zaproxy.
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          target: ${{ inputs.target }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
