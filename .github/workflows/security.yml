---
name: OWASP ZAP Baseline Scan

# Manual only. The previous `on: [push]` trigger scanned a hard-coded
# third-party URL (https://www.zaproxy.org) from the upstream template on
# every push, which is neither useful nor ours to scan. Point `target` at a
# deployed worxbend environment when one exists, then re-enable a schedule.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "HTTPS URL to scan. Its host must appear in the ZAP_ALLOWED_HOSTS repository variable."
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Anyone who can dispatch this workflow can choose the URL, and the scan
      # is an active one. Stating "must be an environment we own" in the input
      # description asks for that; this enforces it. The allowlist lives in the
      # ZAP_ALLOWED_HOSTS repository variable as a comma-separated host list,
      # and an unset variable fails closed rather than scanning anything.
      - name: Validate scan target
        env:
          TARGET: ${{ inputs.target }}
          ALLOWED_HOSTS: ${{ vars.ZAP_ALLOWED_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${ALLOWED_HOSTS:-}" ]; then
            echo "::error::ZAP_ALLOWED_HOSTS is not configured, so no scan target can be authorised."
            echo "Set it to a comma-separated list of hosts this repository is allowed to scan."
            exit 1
          fi

          scheme="${TARGET%%://*}"
          if [ "$scheme" != "https" ]; then
            echo "::error::Target must use https, got '${scheme}'."
            exit 1
          fi

          # Strip scheme, then any credentials, then path/query/fragment and port.
          rest="${TARGET#https://}"
          rest="${rest##*@}"
          host="${rest%%/*}"
          host="${host%%\?*}"
          host="${host%%#*}"
          host="${host%%:*}"

          if [ -z "$host" ]; then
            echo "::error::Could not parse a host out of the target URL."
            exit 1
          fi

          IFS=',' read -ra allowed <<< "$ALLOWED_HOSTS"
          for entry in "${allowed[@]}"; do
            candidate="$(echo "$entry" | tr -d '[:space:]')"
            if [ -n "$candidate" ] && [ "$host" = "$candidate" ]; then
              echo "Target host '${host}' is allowlisted."
              exit 0
            fi
          done

          echo "::error::Host '${host}' is not in ZAP_ALLOWED_HOSTS."
          echo "Active scanning a host we do not own is not something this workflow will do."
          exit 1

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # owasp/zap2docker-stable was retired in 2023; the image now lives
          # at ghcr.io/zaproxy/zaproxy.
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          target: ${{ inputs.target }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
