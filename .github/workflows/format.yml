name: Format

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format & Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Check out the actual PR head branch so we can push back to it.
          ref: ${{ github.head_ref }}
          # Full history: scalafmt --mode diff needs the base branch present.
          fetch-depth: 0
          # A PAT is required if you want the auto-commit to trigger further
          # CI runs. With the default GITHUB_TOKEN the commit is still pushed
          # but will not re-trigger workflows (avoids infinite loops).
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Scala: scalafmt ──────────────────────────────────────────────────
      # setup-action installs a JVM plus the requested apps on PATH.
      # coursier/cache-action alone only restores ~/.cache/coursier — it does
      # not provide the `cs` binary, which is why this step is required.
      - name: Setup Coursier + scalafmt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21
          apps: scalafmt:3.9.0

      - name: Cache Coursier
        uses: coursier/cache-action@v6

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Run scalafmt
        run: |
          scalafmt \
            --non-interactive \
            --mode diff \
            --diff-branch origin/${{ github.base_ref }}

      # ── YAML / JSON: prettier ────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the files this PR touches, mirroring scalafmt's --mode diff.
      # A repo-wide sweep would drag hundreds of unrelated reformats into
      # every PR's auto-commit.
      # NUL-delimited: a path containing a space, a quote or a newline is legal
      # in git and would otherwise be split into several bogus filenames, so the
      # formatters would either miss it or be handed garbage. The base ref goes
      # through the environment rather than being interpolated into the script.
      - name: Collect changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff -z --name-only --diff-filter=d \
            "origin/${BASE_REF}...HEAD" > /tmp/changed.txt
          echo "Changed files:"
          tr '\0' '\n' < /tmp/changed.txt

      - name: Run prettier (YAML + JSON)
        run: |
          mapfile -t -d '' files < <(grep -zE '\.(ya?ml|json)$' /tmp/changed.txt || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No YAML/JSON changed — skipping."
          else
            npx --yes prettier@3 --write "${files[@]}"
          fi

      # ── TOML: taplo ──────────────────────────────────────────────────────
      - name: Run taplo (TOML)
        run: |
          mapfile -t -d '' files < <(grep -zE '\.toml$' /tmp/changed.txt || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No TOML changed — skipping."
          else
            npx --yes @taplo/cli@0.7 format "${files[@]}"
          fi

      # ── Justfile ─────────────────────────────────────────────────────────
      - name: Setup just
        uses: extractions/setup-just@v2

      # `just --fmt` takes the target via --justfile; a bare positional is
      # parsed as a recipe name and rejected.
      - name: Run just --fmt
        run: |
          if grep -qzx 'justfile' /tmp/changed.txt; then
            just --fmt --unstable --justfile justfile
          else
            echo "justfile unchanged — skipping."
          fi

      # ── Commit any formatting changes back to the PR branch ──────────────
      - name: Commit formatted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format (scalafmt, prettier, taplo, just)"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
