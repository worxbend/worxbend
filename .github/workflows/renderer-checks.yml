name: Renderer contracts

on:
  pull_request:
    paths:
      - "libs/commons/reveal/**"
      - "libs/commons/pretty-printo/**"
      - "libs/commons/renderer-benchmarks/**"
      - "build.mill"
      - ".mill-version"
      - ".github/workflows/renderer-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MILL_JVM_OPTS: "-Xss10m -Xmx6g -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c # v6
      - name: Regression suites
        run: ./mill --no-server 'libs.commons.{reveal,pretty-printo}.test'
      - name: External macro consumers on a small stack
        run: ./mill --no-server libs.commons.reveal.checkConsumer
      - name: Benchmark discovery and smoke run
        run: ./mill --no-server libs.commons.renderer-benchmarks.runJmh -f 1 -wi 1 -i 1 -w 100ms -r 100ms -p size=1 -p multiline=false -foe true
