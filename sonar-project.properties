# SonarCloud analysis settings.
#
# The scanner refuses to run without projectKey/organization. Adjust these to
# match the SonarCloud project once it is created, and add a SONAR_TOKEN
# repository secret — until then the Sonar workflow skips itself.
sonar.projectKey=worxbend_worxbend
sonar.organization=worxbend
sonar.host.url=https://sonarcloud.io

sonar.projectName=worxbend
sonar.sources=applications,libs,extras
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.sourceEncoding=UTF-8
sonar.exclusions=out/**,**/target/**,**/generated/**,.cookiecutter/**
