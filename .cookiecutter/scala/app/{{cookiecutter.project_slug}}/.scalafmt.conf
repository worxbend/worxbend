version = "3.11.5"

runner.dialect = scala3
runner.dialectOverride {
  allowSignificantIndentation = true
  allowAsForImportRename = true
  allowStarWildcardImport = true
}

maxColumn = 120
lineEndings = keep
assumeStandardLibraryStripMargin = false

align {
  preset = most
  multiline = true
  stripMargin = true
  arrowEnumeratorGenerator = true
  openParenCallSite = false
  openParenDefnSite = true
  openBracketDefnSite = true
  tokens."+" = [{
    code = ":"
    owners = [{
      regex = "Term\\.Param"
      parents = ["Ctor\\.Primary"]
    }]
  }]
}

binPack.literalArgumentLists = true

docstrings {
  forceBlankLineBefore = false
  oneline = keep
  style = SpaceAsterisk
  wrap = keep
}

spaces {
  inImportCurlyBraces = true
  beforeContextBoundColon = IfMultipleBounds
  inInterpolatedStringCurlyBraces = false
}

indent.infix.exemptScope = all

newlines {
  source = keep
  selfAnnotation = true
  forceBeforeMultilineAssign = never
  implicitParamListModifierPrefer = before
  beforeCurlyLambdaParams = multilineWithCaseOnly
  inInterpolation = avoid
  afterCurlyLambdaParams = squash
  topLevelBodyIfMinStatements = [before, after]
  topLevelBodyMinStatements = 2
  topLevelStatementBlankLines = [
    { blanks = 1 }
  ]
  selectChains.classicCanStartWithoutApply = true
}

project {
  git = true
  includePaths = [
    "glob:**.scala"
    "glob:**.sbt"
    "glob:**.sc"
    "glob:**.mill"
  ]
  excludePaths = [
    "glob:**/.cookiecutter/**"
    "glob:**/scalafix/input/**"
    "glob:**/scalafix/output/**"
    "glob:**/target/**"
    "glob:**/generated/**"
  ]
}

fileOverride {
  "glob:**/*.sbt" {
    newlines.topLevelStatementBlankLines = [
      {
        blanks.afterAll = -1
        minBreaks = 0
      }
    ]
    runner.dialect = scala212
  }

  "glob:**/project/*.scala" {
    newlines.topLevelStatementBlankLines = [
      {
        blanks.afterAll = -1
        minBreaks = 0
      }
    ]
    runner.dialect = scala212
  }
}

rewrite {
  trailingCommas.style = multiple
  rules = [
    PreferCurlyFors
    SortModifiers
    AvoidInfix
    RedundantParens
    RedundantBraces
    Imports
  ]
  tokens = {
    "⇒" = "=>"
    "→" = "->"
    "←" = "<-"
  }
  redundantBraces {
    defnBodies = all
    includeUnitMethods = false
    stringInterpolation = true
    generalExpressions = true
    ifElseExpressions = true
    oneStatApply.parensMaxSpan = 0
  }
  imports {
    sort = scalastyle
    groups = [
      ["com\\.worxbend\\..*"]
      ["zio\\..*"]
      ["izumi\\..*"]
      ["distage\\..*"]
      ["cats\\..*"]
      ["cats"]
      ["io\\..*"]
      ["io\\.netty\\..*"]
      ["org\\.joda\\..*"]
      ["org\\.log4s\\..*"]
      ["org\\.log4j\\..*"]
      ["org\\.slf4j\\..*"]
      ["org\\.apache\\..*"]
      ["com\\.typesafe\\..*"]
      ["com\\.lightbend\\..*"]
      ["com\\.github\\..*"]
      ["com\\.google\\..*"]
      ["com\\.fasterxml\\..*"]
      ["com\\.squareup\\..*"]
      ["com\\.twitter\\..*"]
      ["scala\\..*"]
      ["scala\\.collection\\..*"]
      ["scala\\.concurrent\\..*"]
      ["scala\\.math\\..*"]
      ["scala\\.util\\..*"]
      ["java\\..*"]
      ["java\\.time\\..*"]
      ["java\\.lang\\..*"]
      ["com\\.sun\\..*"]
    ]
  }
  sortModifiers.order = [
    implicit
    final
    sealed
    abstract
    private
    protected
    erased
    lazy
    transparent
    inline
    infix
    opaque
    override
    open
  ]
  avoidInfix.excludeFilters = [
    until
    to
    by
    eq
    ne
    "should.*"
    "contain.*"
    "must.*"
    in
    ignore
    be
    taggedAs
    thrownBy
    synchronized
    have
    when
    size
    only
    noneOf
    oneElementOf
    noElementsOf
    atLeastOneElementOf
    atMostOneElementOf
    allElementsOf
    inOrderElementsOf
    theSameElementsAs
  ]
}

literals {
  long = Upper
  float = Lower
  double = Lower
  hexDigits = Lower
  hexPrefix = Lower
  scientific = Lower
}
