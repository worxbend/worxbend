version = "3.11.5"

runner.dialect = scala3
runner.dialectOverride {
  allowSignificantIndentation = true
  allowAsForImportRename = true
  allowStarWildcardImport = true
}

maxColumn = 120
lineEndings = keep
assumeStandardLibraryStripMargin = false

align {
  preset = most
  multiline = true
  stripMargin = true
  arrowEnumeratorGenerator = true
  openParenCallSite = false
  openParenDefnSite = true
  openBracketDefnSite = true
}

docstrings {
  forceBlankLineBefore = false
  oneline = keep
  style = SpaceAsterisk
  wrap = keep
}

spaces {
  inImportCurlyBraces = true
  beforeContextBoundColon = IfMultipleBounds
  inInterpolatedStringCurlyBraces = false
}

indent.infix.exemptScope = all

newlines {
  source = keep
  selfAnnotation = true
  forceBeforeMultilineAssign = never
  implicitParamListModifierPrefer = before
  beforeCurlyLambdaParams = multilineWithCaseOnly
  inInterpolation = avoid
  afterCurlyLambdaParams = squash
  topLevelBodyIfMinStatements = [before, after]
  topLevelBodyMinStatements = 2
  topLevelStatementBlankLines = [
    { blanks = 1 }
  ]
  selectChains.classicCanStartWithoutApply = true
}

project {
  git = true
  includePaths = [
    "glob:**.scala"
    "glob:**.sbt"
    "glob:**.sc"
    "glob:**.mill"
  ]
  excludePaths = [
    "glob:**/target/**"
  ]
}

rewrite {
  trailingCommas.style = multiple
  rules = [
    PreferCurlyFors
    SortModifiers
    AvoidInfix
    RedundantParens
    RedundantBraces
    Imports
  ]
  tokens = {
    "⇒" = "=>"
    "→" = "->"
    "←" = "<-"
  }
  redundantBraces {
    defnBodies = all
    includeUnitMethods = false
    stringInterpolation = true
    generalExpressions = true
    ifElseExpressions = true
  }
  imports {
    sort = scalastyle
    groups = [
      ["com\\.airgradient\\..*"]
      ["izumi\\..*"]
      ["distage\\..*"]
      ["sttp\\..*"]
      ["ox\\..*"]
      ["com\\.github\\.pureconfig\\..*"]
      ["com\\.github\\.plokhotnyuk\\..*"]
      ["scala\\..*"]
      ["java\\..*"]
    ]
  }
  sortModifiers.order = [
    implicit
    final
    sealed
    abstract
    private
    protected
    erased
    lazy
    transparent
    inline
    infix
    opaque
    override
    open
  ]
}

literals {
  long = Upper
  float = Lower
  double = Lower
  hexDigits = Lower
  hexPrefix = Lower
  scientific = Lower
}
