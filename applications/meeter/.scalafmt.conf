version = "3.11.5"

runner.dialect = scala3

maxColumn = 100
lineEndings = keep
assumeStandardLibraryStripMargin = false

align {
  preset = most
  multiline = true
  stripMargin = true
  arrowEnumeratorGenerator = true
  openParenCallSite = false
  openParenDefnSite = true
  openBracketDefnSite = true
  tokens."+" = [{
    code = ":"
    owners = [{
      regex = "Term\\.Param"
      parents = ["Ctor\\.Primary"]
    }]
  }]
}

docstrings {
  forceBlankLineBefore = false
  oneline = keep
  style = SpaceAsterisk
  wrap = keep
}

spaces {
  inImportCurlyBraces = true
  beforeContextBoundColon = IfMultipleBounds
  inInterpolatedStringCurlyBraces = true
}

indent.infix.exemptScope = all

newlines {
  selectChains.classicCanStartWithoutApply = true
  topLevelBodyIfMinStatements = [before, after]
  alwaysBeforeElseAfterCurlyIf = true
  beforeCurlyLambdaParams = multilineWithCaseOnly
  forceBeforeMultilineAssign = def
  beforeMultiline = unfold
  avoidInResultType = true
  avoidForSimpleOverflow = [slc]
  implicitParamListModifierForce = [after]
  inInterpolation = avoid
  penalizeSingleSelectMultiArgList = true
  topLevelStatementBlankLines = [
    {
      blanks {
        beforeAll = -1
        afterAll = -1
        beforeEndMarker = -1
      }
      minBreaks = 0
    }
    {
      blanks {
        beforeAll = -1
        before = 1
        after = 1
        afterAll = -1
        beforeEndMarker = -1
      }
      minBreaks = 0
    }
  ]
}

project {
  git = true
  includePaths = [
    "glob:**.scala"
    "glob:**.sbt"
    "glob:**.sc"
    "glob:**.mill"
  ]
  excludePaths = [
    "regex:.metals"
    "glob:**/scalafix/input/**"
    "glob:**/scalafix/output/**"
  ]
}

fileOverride {
  "glob:**/*.sbt" {
    newlines.topLevelStatementBlankLines = [
      {
        blanks.afterAll = -1
        minBreaks = 0
      }
    ]
    runner.dialect = scala212
  }

  "glob:**/project/*.scala" {
    newlines.topLevelStatementBlankLines = [
      {
        blanks.afterAll = -1
        minBreaks = 0
      }
    ]
    runner.dialect = scala212
  }
}

rewrite {
  trailingCommas.style = multiple
  rules = [
    PreferCurlyFors
    SortModifiers
    AvoidInfix
    RedundantParens
    RedundantBraces
    Imports
  ]
  tokens = {
    "⇒" = "=>"
    "→" = "->"
    "←" = "<-"
  }
  redundantBraces {
    defnBodies = all
    includeUnitMethods = true
    stringInterpolation = true
    generalExpressions = true
    ifElseExpressions = true
    oneStatApply.parensMaxSpan = 0
  }
  imports {
    selectors = unfold
    sort = scalastyle
    groups = [
      ["com\\.worxbend\\..*"]
      ["zio\\..*"]
      ["io\\..*"]
      ["izumi\\..*"]
      ["scala\\..*"]
      ["java\\..*"]
      ["io\\.netty\\..*"]
      ["com\\.sun\\..*"]
    ]
  }
  sortModifiers.order = [
    implicit
    final
    sealed
    abstract
    private
    protected
    erased
    lazy
    transparent
    inline
    infix
    opaque
    override
    open
  ]
  avoidInfix.excludeFilters = [
    until
    to
    by
    eq
    ne
    "should.*"
    "contain.*"
    "must.*"
    in
    ignore
    be
    taggedAs
    thrownBy
    synchronized
    have
    when
    size
    only
    noneOf
    oneElementOf
    noElementsOf
    atLeastOneElementOf
    atMostOneElementOf
    allElementsOf
    inOrderElementsOf
    theSameElementsAs
  ]
}

literals {
  long = Upper
  float = Lower
  double = Lower
  hexDigits = Lower
  hexPrefix = Lower
  scientific = Lower
}
